name = "justfuckingroll"
main = "src/worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Custom domain is attached on deploy (DNS + certificate handled by Cloudflare).
routes = [
  { pattern = "justfuckingroll.com", custom_domain = true },
  { pattern = "www.justfuckingroll.com", custom_domain = true },
]

[assets]
directory = "dist/client"
not_found_handling = "single-page-application"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "justfuckingroll"
database_id = "8a4ba5d2-1c56-46ad-98b4-0b0fd07735ef"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionDO"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceDO"

# SQLite-backed Durable Objects (available on the free Workers plan).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO", "PresenceDO"]
