name = "blindloot"
main = "src/worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "dist/client"
not_found_handling = "single-page-application"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "blindloot"
database_id = "216f1fce-c594-446f-b740-4c6b37655e58"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionDO"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceDO"

# SQLite-backed Durable Objects (available on the free Workers plan).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO", "PresenceDO"]
