name = "justfuckingroll"
main = "src/worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Custom domain is attached on deploy (DNS + certificate handled by Cloudflare).
# www is deliberately NOT a custom domain: its worker-domain cert caused
# ERR_SSL_PROTOCOL_ERROR / ERR_QUIC_PROTOCOL_ERROR for some users. Instead, a
# proxied DNS record + dashboard Redirect Rule sends www -> apex (see README).
routes = [
  { pattern = "justfuckingroll.com", custom_domain = true },
]

[assets]
directory = "dist/client"
not_found_handling = "single-page-application"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "justfuckingroll"
database_id = "8a4ba5d2-1c56-46ad-98b4-0b0fd07735ef"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionDO"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceDO"

# SQLite-backed Durable Objects (available on the free Workers plan).
# v2/v3 were a one-time wipe: delete the classes (bindings temporarily removed for that
# deploy, since a bound class cannot be deleted), then recreate them empty.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionDO", "PresenceDO"]

[[migrations]]
tag = "v2"
deleted_classes = ["SessionDO", "PresenceDO"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SessionDO", "PresenceDO"]
